name: MojSlownik
options:
  developmentLanguage: en
  bundleIdPrefix: com.kirill.personal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Project-level, so it covers app and test targets but not Swift packages.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.7
targets:
  MojSlownik:
    type: application
    platform: iOS
    sources:
      - MojSlownik
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: MojSlownik/Info.plist
      properties:
        CFBundleDisplayName: Mój Słownik
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Fallback (English) texts; InfoPlist.xcstrings localizes them (en, ru).
        CFBundleLocalizations:
          - en
          - ru
        NSCameraUsageDescription: The camera is used to scan words and add them to your dictionary.
        NSMicrophoneUsageDescription: The microphone is used to dictate Polish words to add to your dictionary.
        NSSpeechRecognitionUsageDescription: Speech recognition is used to enter Polish words by voice. Speech may be processed on Apple servers.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kirill.personal.mojslownik
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        # Assets.xcassets holds images only (no app icon yet).
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  MojSlownikTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MojSlownikTests
    dependencies:
      - target: MojSlownik
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kirill.personal.mojslownik.tests
        GENERATE_INFOPLIST_FILE: YES
  MojSlownikUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MojSlownikUITests
    dependencies:
      - target: MojSlownik
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kirill.personal.mojslownik.uitests
        TEST_TARGET_NAME: MojSlownik
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MojSlownik:
    build:
      targets:
        MojSlownik: all
        MojSlownikUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MojSlownikUITests
  MojSlownikUnitTests:
    build:
      targets:
        MojSlownik: all
        MojSlownikTests: [test]
    test:
      config: Debug
      # Unit tests run in English; Russian is checked through explicit ru bundle lookups.
      language: en
      region: US
      targets:
        - MojSlownikTests
  MojSlownikE2E:
    build:
      targets:
        MojSlownik: all
        MojSlownikUITests: [test]
    test:
      config: Debug
      targets:
        - name: MojSlownikUITests
          parallelizable: true
