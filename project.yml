name: MojSlownik
options:
  bundleIdPrefix: com.kirill.personal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  MojSlownik:
    type: application
    platform: iOS
    sources:
      - MojSlownik
    info:
      path: MojSlownik/Info.plist
      properties:
        CFBundleDisplayName: Mój Słownik
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Камера нужна для сканирования слов и их добавления в словарь.
        NSMicrophoneUsageDescription: Микрофон нужен, чтобы диктовать польские слова для добавления в словарь.
        NSSpeechRecognitionUsageDescription: Распознавание нужно для ввода польских слов голосом. Речь может обрабатываться на серверах Apple.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kirill.personal.mojslownik
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
  MojSlownikTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MojSlownikTests
    dependencies:
      - target: MojSlownik
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kirill.personal.mojslownik.tests
        GENERATE_INFOPLIST_FILE: YES
  MojSlownikUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MojSlownikUITests
    dependencies:
      - target: MojSlownik
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kirill.personal.mojslownik.uitests
        TEST_TARGET_NAME: MojSlownik
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MojSlownik:
    build:
      targets:
        MojSlownik: all
        MojSlownikUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MojSlownikUITests
  MojSlownikUnitTests:
    build:
      targets:
        MojSlownik: all
        MojSlownikTests: [test]
    test:
      config: Debug
      targets:
        - MojSlownikTests
