<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Progress Final</title>
<style>
:root{
  --bg:#FAF8F2;--card:#FFFFFF;--ink:#1C1B17;--subtle:#6B675C;--border:#E7E2D5;--surface2:#F0ECE1;
  --accent:#FFD43B;--onAccent:#1C1B17;--accentText:#8A6A00;--accentStrong:#1C1B17;--accentSoft:#FFF3BF;
  --inverse:#1C1B17;--ringTrack:#CDC5B0;--mastery:#25704C;--learning:#B8860B;
  --error:#B3261E;--warning:#7C4C17;--warningSurf:#FBEFDB;--caution:#C77700;--page:#ECE8DD;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141310;--card:#1F1E1A;--ink:#F4F1E8;--subtle:#A8A293;--border:#2E2C26;--surface2:#2A2823;
  --accentText:#FFD43B;--accentStrong:#FFD43B;--accentSoft:#3A3318;--ringTrack:#46423A;--mastery:#8BD3A8;--learning:#FFD43B;
  --error:#FF8A80;--warning:#F4C787;--warningSurf:#43311D;--caution:#FFA94D;--page:#0B0A08;
}}
:root[data-theme="dark"]{
  --bg:#141310;--card:#1F1E1A;--ink:#F4F1E8;--subtle:#A8A293;--border:#2E2C26;--surface2:#2A2823;
  --accentText:#FFD43B;--accentStrong:#FFD43B;--accentSoft:#3A3318;--ringTrack:#46423A;--mastery:#8BD3A8;--learning:#FFD43B;
  --error:#FF8A80;--warning:#F4C787;--warningSurf:#43311D;--caution:#FFA94D;--page:#0B0A08;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
header{max-width:1240px;margin:0 auto;padding:24px 16px 4px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
header div{flex:1 1 300px}
h1{font-size:22px;margin:0}
header p{margin:4px 0 0;color:var(--subtle);font-size:14px}
.toggle{border:1px solid var(--border);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
main{max-width:1240px;margin:0 auto;padding:12px 16px 40px;display:flex;gap:24px;flex-wrap:wrap}
figure{margin:0;width:340px;max-width:100%}
figcaption{font-size:13px;color:var(--subtle);margin-top:8px;line-height:1.4}
figcaption b{color:var(--ink)}
.phone{background:var(--bg);border-radius:38px;border:1px solid var(--border);padding:14px 18px 22px;min-height:640px;overflow:hidden}
.status{display:flex;justify-content:space-between;font-size:13px;font-weight:600;padding:0 6px 8px}
.nav{display:flex;justify-content:center;align-items:center;gap:4px;font-weight:600;font-size:16px;padding:2px 0 12px}
.nav small{color:var(--subtle);font-size:12px}
.picker{display:inline-flex;gap:6px;align-items:center;color:var(--accentText);font-weight:500;margin-bottom:12px;min-height:32px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sh{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--subtle);margin:18px 0 6px}
.hero{background:var(--accent);color:var(--onAccent);border-radius:24px;padding:16px}
.hero .k{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;opacity:.75}
.hero .n{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.hero .n small{font-size:20px;font-weight:600;opacity:.75}
.hero .line{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hero .st{font-size:14px;opacity:.75}
.hbar{height:8px;border-radius:99px;background:rgba(28,27,23,.12);overflow:hidden;margin:10px 0 12px}
.hbar i{display:block;height:100%;width:25%;background:var(--onAccent);border-radius:99px}
.cta{background:var(--inverse);color:var(--accent);text-align:center;border-radius:16px;padding:15px;font-weight:700}
.badges{display:flex;gap:8px;margin-top:12px}
.badges span{background:rgba(28,27,23,.12);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:500}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:12px;min-height:96px}
.tile .ic{width:36px;height:36px;border-radius:12px;background:var(--accentSoft);display:grid;place-items:center;margin-bottom:8px;color:var(--ink)}
.tile b{display:block;font-size:15px}.tile small{color:var(--subtle);font-size:13px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px}
.seg{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface2);gap:2px}
.seg .l{background:var(--mastery)}.seg .m{background:var(--learning)}.seg .n0{background:var(--ringTrack)}
.legend{display:flex;gap:10px;margin-top:10px}
.legend div{flex:1 1 0}
.legend b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.legend span{font-size:13px;color:var(--subtle);display:flex;gap:6px;align-items:center}
.legend.ax{flex-direction:column;gap:6px}
.legend.ax div{display:flex;align-items:baseline;gap:10px}
.legend.ax b{font-size:26px;display:inline}
.legend.ax span{font-size:20px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.rows{margin-top:12px}
.rl{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--border);padding:6px 0}
.rl .ic{width:32px;height:32px;border-radius:12px;background:var(--accentSoft);display:grid;place-items:center;flex:none;color:var(--ink)}
.rl .t{flex:1;font-size:15px}
.rl .t small{display:block;color:var(--subtle);font-size:13px}
.rl .v{font-weight:700;font-variant-numeric:tabular-nums}
.rl .chev{color:var(--subtle)}
.ach{display:flex;align-items:center;gap:12px}
.ach .ic{width:40px;height:40px;border-radius:13px;background:var(--accentSoft);display:grid;place-items:center;color:var(--ink)}
.sheetbar{width:36px;height:5px;border-radius:9px;background:var(--border);margin:0 auto 12px}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:600}
.sheethead a{color:var(--accentText);font-weight:600}
.group{border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--border)}
.fr{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--border);min-height:60px}
.fr:first-child{border-top:0}
.fr .t{flex:1}
.fr .t small{display:block;color:var(--subtle);font-size:13px;font-variant-numeric:tabular-nums}
.mini{height:4px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:6px;display:flex;gap:1px}
.mini .l{background:var(--mastery)}.mini .m{background:var(--learning)}
.check{color:var(--accentStrong);font-weight:700}
.addf{color:var(--accentText);font-weight:600;display:flex;gap:6px;align-items:center;padding:14px 4px}
.prog{display:flex;gap:10px;align-items:center;margin-bottom:14px;font-size:13px;color:var(--subtle);font-variant-numeric:tabular-nums}
.prog .bar{flex:1;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog .bar i{display:block;height:100%;width:40%;background:var(--accentStrong)}
.flash{background:var(--card);border:1px solid var(--border);border-radius:28px;padding:18px;text-align:center;min-height:280px;display:flex;flex-direction:column;align-items:center}
.pill{display:inline-flex;gap:5px;align-items:center;border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600;background:var(--warningSurf);color:var(--warning)}
.flash .w{font-size:28px;font-weight:900;margin:auto 0 4px;overflow-wrap:normal;hyphens:manual}
.flash .tr{color:var(--subtle);font-size:20px;margin-bottom:auto}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--subtle);margin-top:10px}
.grades{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.grades div{background:var(--card);border:1px solid var(--border);border-radius:12px;min-height:56px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:700}
.grades small{font-weight:500;color:var(--subtle);font-size:13px;font-variant-numeric:tabular-nums}
.grades .ag{color:var(--error)}
.grades .ez{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.grades .ez small{color:var(--onAccent);opacity:.75}
.wrow{padding:12px 0;border-bottom:1px solid var(--border)}
.wrow .top{display:flex;align-items:center;gap:10px}
.wrow .pl{font-size:20px;font-weight:700;flex:1}
.wrow .ru{color:var(--subtle);font-size:14px;margin-top:2px;display:flex;gap:8px;align-items:center}
.cap{background:var(--surface2);border-radius:99px;padding:2px 9px;font-size:12px;color:var(--ink)}
.spk{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.search{background:var(--surface2);border-radius:12px;padding:9px 12px;color:var(--subtle);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.ringlegend{display:flex;justify-content:space-between;margin-top:14px;font-size:12px;color:var(--subtle)}
.ringlegend div{display:flex;flex-direction:column;align-items:center;gap:4px}
.note{font-size:12px;color:var(--subtle);margin-top:10px;line-height:1.4}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="warn" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17.2v.1"/></symbol>
  <symbol id="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="cards" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="14" rx="2.5"/><path d="M8 3.5h10.5A2.5 2.5 0 0 1 21 6v11"/></symbol>
  <symbol id="list" viewBox="0 0 24 24"><path d="m4 7 2 2 3-3M4 15l2 2 3-3M12 8h8M12 16h8"/></symbol>
  <symbol id="ear" viewBox="0 0 24 24"><path d="M7 9a5 5 0 0 1 10 0c0 3-3 4-3 7a3 3 0 0 1-6 0"/><path d="M10 9.5a2 2 0 0 1 4 0"/></symbol>
  <symbol id="trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3M12 13v4M8.5 20h7"/></symbol>
  <symbol id="spk" viewBox="0 0 24 24"><path d="M4 10v4h3l4 3.5v-11L7 10zM15 9a4 4 0 0 1 0 6M17.5 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="mag" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></symbol>
</svg>

<header>
  <div>
    <h1>Final design: progress, review schedule, hard words</h1>
    <p>Direction A · «учу» honey #B8860B in light, yellow in dark · ring tier 2 uses the same colour · Маркер tokens.</p>
  </div>
  <button class="toggle" id="t">Светлая / тёмная</button>
</header>

<main>
  <!-- 1. Training -->
  <figure>
    <div class="phone">
      <div class="status"><span>9:41</span><span>●●●</span></div>
      <div class="nav">🇵🇱 Польский <svg class="i" style="width:14px"><use href="#down"/></svg></div>
      <div class="picker"><svg class="i"><use href="#folder"/></svg>Все папки<svg class="i" style="width:14px"><use href="#down"/></svg></div>
      <div class="hero">
        <div class="line"><div><div class="k">Сегодня</div><div class="n">3 <small>из 12</small></div></div><div class="st">Осталось слов: 9</div></div>
        <div class="hbar"><i></i></div>
        <div class="cta">Продолжить · 9</div>
        <div class="badges"><span>✓ Верно: 7</span><span>✕ Ошибок: 2</span></div>
      </div>
      <div class="sh">Режимы</div>
      <div class="tiles">
        <div class="tile"><div class="ic"><svg class="i"><use href="#cards"/></svg></div><b>Карточки</b><small>Вспомните перевод</small></div>
        <div class="tile"><div class="ic"><svg class="i"><use href="#list"/></svg></div><b>Тест</b><small>Выберите ответ</small></div>
      </div>
      <div class="sh">Прогресс</div>
      <div class="card">
        <div class="seg" aria-hidden="true"><span class="l" style="width:39%"></span><span class="m" style="width:44%"></span><span class="n0" style="width:17%"></span></div>
        <div class="legend">
          <div><b>48</b><span><i class="dot" style="background:var(--mastery)"></i>выучено</span></div>
          <div><b>54</b><span><i class="dot" style="background:var(--learning)"></i>учу</span></div>
          <div><b>21</b><span><i class="dot" style="background:var(--ringTrack)"></i>новые</span></div>
        </div>
        <div class="rows">
          <div class="rl"><div class="ic"><svg class="i"><use href="#cal"/></svg></div><div class="t">Завтра 14 · за неделю 63<small>Повторения по расписанию</small></div></div>
          <div class="rl"><div class="ic"><svg class="i"><use href="#warn"/></svg></div><div class="t">Трудные слова<small>Забыты 6 раз и больше</small></div><div class="v">5</div><svg class="i chev"><use href="#chev"/></svg></div>
        </div>
      </div>
      <div class="sh">Достижения</div>
      <div class="card ach"><div class="ic"><svg class="i"><use href="#trophy"/></svg></div><div style="flex:1"><b>120 очков</b><div style="font-size:13px;color:var(--subtle)">Серия 4 дня</div></div><span style="color:var(--subtle)">7 из 24</span><svg class="i chev" style="color:var(--subtle)"><use href="#chev"/></svg></div>
    </div>
    <figcaption><b>Практика.</b> The hero is unchanged. The new «Прогресс» card sits under the modes (Listening tile omitted here for space) and follows the folder picker. With zero hard words the row is hidden.</figcaption>
  </figure>

  <!-- 2. Folder sheet -->
  <figure>
    <div class="phone">
      <div class="status"><span>9:41</span><span>●●●</span></div>
      <div class="sheetbar"></div>
      <div class="sheethead"><span style="color:var(--accentText)">Править</span><span>Папки</span><a>Готово</a></div>
      <div class="group">
        <div class="fr"><div class="t">Все папки<small>выучено 48 из 123</small><div class="mini"><span class="l" style="width:39%"></span><span class="m" style="width:44%"></span></div></div><span class="check">✓</span></div>
        <div class="fr"><div class="t">Еда<small>выучено 18 из 40</small><div class="mini"><span class="l" style="width:45%"></span><span class="m" style="width:40%"></span></div></div></div>
        <div class="fr"><div class="t">Работа<small>выучено 6 из 31</small><div class="mini"><span class="l" style="width:19%"></span><span class="m" style="width:55%"></span></div></div></div>
        <div class="fr"><div class="t">Транспорт<small>выучено 24 из 24</small><div class="mini"><span class="l" style="width:100%"></span></div></div></div>
        <div class="fr"><div class="t">Скан 14 ноября<small>выучено 0 из 12</small><div class="mini"><span class="m" style="width:25%"></span></div></div></div>
      </div>
      <div class="addf"><svg class="i"><use href="#plus"/></svg>Новая папка</div>
      <p class="note">«Выучено»: слово повторяется раз в 21 день и реже. Интервалы растут не дальше 30 дней, поэтому выученные слова возвращаются раз в месяц.</p>
    </div>
    <figcaption><b>Folder sheet.</b> Each row has «выучено X из Y» as text plus a thin bar (green learned, honey learning, empty new).</figcaption>
  </figure>

  <!-- 3. Flashcard -->
  <figure>
    <div class="phone">
      <div class="status"><span>9:41</span><span>●●●</span></div>
      <div class="nav">Карточки</div>
      <div class="prog"><span>4 из 9</span><div class="bar"><i></i></div></div>
      <div class="flash">
        <span class="pill"><svg class="i" style="width:15px;height:15px"><use href="#warn"/></svg>Трудное слово</span>
        <div class="w">przyzwyczajenie</div>
        <div class="tr">привычка</div>
        <div class="spk"><svg class="i"><use href="#spk"/></svg></div>
        <div class="side">Польский → русский</div>
      </div>
      <div class="grades">
        <div class="ag">Не помню<small>10 мин</small></div>
        <div>Трудно<small>2 дн.</small></div>
        <div>Помню<small>7 дн.</small></div>
        <div class="ez">Легко<small>14 дн.</small></div>
      </div>
    </div>
    <figcaption><b>Flashcard (back side).</b> The «Трудное слово» pill appears only for hard words. Each grade shows the next interval; none goes above 30 days.</figcaption>
  </figure>

  <!-- 4. Dictionary ring -->
  <figure>
    <div class="phone">
      <div class="status"><span>9:41</span><span>●●●</span></div>
      <div class="nav">🇵🇱 Польский <svg class="i" style="width:14px"><use href="#down"/></svg></div>
      <div class="search"><svg class="i"><use href="#mag"/></svg>Поиск</div>
      <div class="wrow"><div class="top"><span class="pl">jabłko</span>
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.8" fill="none" stroke="var(--ringTrack)" stroke-width="4.4"/><circle cx="11" cy="11" r="8.8" fill="none" stroke="var(--mastery)" stroke-width="4.4" pathLength="100" stroke-dasharray="100 100" transform="rotate(-90 11 11)"/></svg>
        <span class="spk"><svg class="i"><use href="#spk"/></svg></span></div><div class="ru">яблоко <span class="cap">Еда</span></div></div>
      <div class="wrow"><div class="top"><span class="pl">przyzwyczajenie</span>
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.8" fill="none" stroke="var(--ringTrack)" stroke-width="4.4"/><circle cx="11" cy="11" r="8.8" fill="none" stroke="var(--error)" stroke-width="4.4" pathLength="100" stroke-dasharray="25 100" transform="rotate(-90 11 11)"/></svg>
        <span class="spk"><svg class="i"><use href="#spk"/></svg></span></div><div class="ru">привычка <span class="cap">Другое</span></div></div>
      <div class="wrow"><div class="top"><span class="pl">pociąg</span>
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.8" fill="none" stroke="var(--ringTrack)" stroke-width="4.4"/><circle cx="11" cy="11" r="8.8" fill="none" stroke="var(--learning)" stroke-width="4.4" pathLength="100" stroke-dasharray="75 100" transform="rotate(-90 11 11)"/></svg>
        <span class="spk"><svg class="i"><use href="#spk"/></svg></span></div><div class="ru">поезд <span class="cap">Транспорт</span></div></div>
      <div class="wrow"><div class="top"><span class="pl">umowa</span>
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.8" fill="none" stroke="var(--ringTrack)" stroke-width="4.4"/><circle cx="11" cy="11" r="8.8" fill="none" stroke="var(--caution)" stroke-width="4.4" pathLength="100" stroke-dasharray="50 100" transform="rotate(-90 11 11)"/></svg>
        <span class="spk"><svg class="i"><use href="#spk"/></svg></span></div><div class="ru">договор <span class="cap">Работа</span></div></div>
      <div class="card ringlegend" style="margin-top:16px">
        <div><svg width="26" height="26" viewBox="0 0 22 22"><circle cx="11" cy="11" r="8.8" fill="none" stroke="var(--ringTrack)" stroke-width="4.4"/><circle cx="11" cy="11" r="8.8" fill="none" stroke="var(--error)" stroke-width="4.4" pathLength="100" stroke-dasharray="25 100" transform="rotate(-90 11 11)"/></svg>Не помню</div>
        <div><svg width="26" height="26" viewBox="0 0 22 22"><circle cx="11" cy="11" r="8.8" fill="none" stroke="var(--ringTrack)" stroke-width="4.4"/><circle cx="11" cy="11" r="8.8" fill="none" stroke="var(--caution)" stroke-width="4.4" pathLength="100" stroke-dasharray="50 100" transform="rotate(-90 11 11)"/></svg>Трудно</div>
        <div><svg width="26" height="26" viewBox="0 0 22 22"><circle cx="11" cy="11" r="8.8" fill="none" stroke="var(--ringTrack)" stroke-width="4.4"/><circle cx="11" cy="11" r="8.8" fill="none" stroke="var(--learning)" stroke-width="4.4" pathLength="100" stroke-dasharray="75 100" transform="rotate(-90 11 11)"/></svg>Помню</div>
        <div><svg width="26" height="26" viewBox="0 0 22 22"><circle cx="11" cy="11" r="8.8" fill="none" stroke="var(--ringTrack)" stroke-width="4.4"/><circle cx="11" cy="11" r="8.8" fill="none" stroke="var(--mastery)" stroke-width="4.4" pathLength="100" stroke-dasharray="100 100" transform="rotate(-90 11 11)"/></svg>Легко</div>
      </div>
    </div>
